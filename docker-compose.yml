services:
  s3-explorer:
    build: .
    image: s3-explorer:latest
    container_name: s3-explorer
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4569
      ALLOWED_HOSTS: ${DOMAIN}
      ALLOWED_ORIGINS: https://${DOMAIN}
      ADMIN_USER: ${ADMIN_USER}
      ADMIN_PASS: ${ADMIN_PASS}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-524288000}
      CHECK_HIBP: ${CHECK_HIBP:-1}
      SECURE_COOKIE: "1"
      TRUST_PROXY: "1"
      DATA_DIR: /data
    volumes:
      - users_data:/data
    # CD-SEC-015: container hardening
    read_only: true
    tmpfs:
      # Upload spool — capped so a malicious user can't fill the FS
      - /tmp/s3-explorer-uploads:rw,size=2g,mode=1700,uid=100,gid=101
      # writable / for /tmp niceties; small cap
      - /tmp:rw,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200
    cpus: 2.0
    expose:
      - "4569"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--header=Host: localhost", "http://127.0.0.1:4569/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    container_name: s3-explorer-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    # CD-SEC-015: hardening for Caddy too
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100
    # CD-SEC-017: wait for app to be healthy before accepting traffic
    depends_on:
      s3-explorer:
        condition: service_healthy
    networks:
      - internal

volumes:
  caddy_data:
  caddy_config:
  users_data:

networks:
  internal:
    driver: bridge
