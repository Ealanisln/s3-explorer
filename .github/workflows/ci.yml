name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Full install (scripts allowed per pnpm-workspace.yaml): the test suite
      # boots the real SQLite layer, so better-sqlite3's native binding must be
      # built. --frozen-lockfile also re-checks the supply-chain policy.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit (high and above)
        run: pnpm audit --audit-level high

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm test
        env:
          NODE_ENV: test

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so gitleaks can scan every commit, not just HEAD.
          fetch-depth: 0

      # Respects .gitleaks.toml at the repo root automatically.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
