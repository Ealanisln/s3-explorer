# =============================================================================
# S3 Explorer — GitLab CI
# =============================================================================
# Runs on every push and merge request. Designed to work on GitLab.com free
# tier shared runners (no Ultimate features required).
#
# Stages:
#   quality   — secret-scan, dependency-audit, lint
#   build     — docker build + image vulnerability scan
#   gate      — final pass/fail summary (use as required-status in MR rules)
# =============================================================================

stages:
  - quality
  - build
  - gate

default:
  interruptible: true

# -----------------------------------------------------------------------------
# Secret scanning — gitleaks against the full history
# -----------------------------------------------------------------------------
secrets:
  stage: quality
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact -v --no-banner
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# -----------------------------------------------------------------------------
# npm audit — high-severity dependency vulnerabilities
# -----------------------------------------------------------------------------
audit:
  stage: quality
  image: node:20-alpine
  script:
    # --ignore-scripts skips better-sqlite3's postinstall (node-gyp rebuild
    # needs python3/g++ which Alpine doesn't ship). CI jobs only do `audit` +
    # `typecheck`; neither touches the native binding — just .d.ts types and
    # package-lock.json. The runtime image still gets the native build via
    # the Dockerfile's `builder` stage, which is the only place it matters.
    - npm ci --no-audit --no-fund --ignore-scripts
    - npm audit --audit-level=high
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# -----------------------------------------------------------------------------
# Lint — node syntax + Dockerfile (hadolint) + Caddyfile
# -----------------------------------------------------------------------------
lint:
  stage: quality
  image: node:20-alpine
  script:
    - apk add --no-cache wget
    # Syntax check on the JS files still in the repo. Once public/app.js
    # migrates to public/src/*.ts (MR 9-10), this list goes to zero and the
    # whole loop can be deleted.
    - for f in public/app.js; do [ -f "$f" ] && (node --check "$f" || exit 1); done
    # TypeScript type-check across both projects (server + web).
    # --ignore-scripts skips better-sqlite3's postinstall (node-gyp rebuild
    # needs python3/g++ which Alpine doesn't ship). CI jobs only do `audit` +
    # `typecheck`; neither touches the native binding — just .d.ts types and
    # package-lock.json. The runtime image still gets the native build via
    # the Dockerfile's `builder` stage, which is the only place it matters.
    - npm ci --no-audit --no-fund --ignore-scripts
    - npm run typecheck
    - wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
    - chmod +x /usr/local/bin/hadolint
    - hadolint --failure-threshold warning Dockerfile
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# -----------------------------------------------------------------------------
# Caddyfile validation — must run separately because needs caddy image
# -----------------------------------------------------------------------------
caddyfile:
  stage: quality
  image: caddy:2-alpine
  variables:
    DOMAIN: example.com    # placeholder for {$DOMAIN} interpolation
  script:
    - caddy validate --config Caddyfile
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# -----------------------------------------------------------------------------
# CVE scan — Trivy filesystem (source + lockfile + Dockerfile)
#
# Antes este job usaba `docker build + trivy image local-tag` con Docker-in-
# Docker, pero MobydickServer (runner self-hosted) no rutea el puerto :2375
# entre service+job containers ni comparte /certs para TLS — DinD falla en
# tres puntos distintos. Trivy puede scanear el filesystem sin daemon Docker.
#
# Solo escaneamos código + deps de la app. El base image (node:20-alpine) está
# pinneado por SHA digest en Dockerfile y manejado por Renovate — scanearlo en
# cada push genera falsos bloqueos por CVEs upstream que no podemos arreglar
# desde este repo. Si en algún momento se quiere un scan periódico del base,
# se mete como cron job separado o renovate-PR check.
# -----------------------------------------------------------------------------
image-scan:
  stage: build
  image:
    name: aquasec/trivy:0.58.1
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivy-cache"
  cache:
    key: trivy-db
    paths:
      - .trivy-cache/
  script:
    - trivy fs
        --severity HIGH,CRITICAL
        --ignore-unfixed
        --exit-code 1
        --format table
        .
  needs:
    - audit
    - lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  timeout: 15 minutes

# -----------------------------------------------------------------------------
# Final gate — use this job as a required check in Merge Request rules
# -----------------------------------------------------------------------------
ci-gate:
  stage: gate
  image: alpine:3.20
  script:
    - echo "✓ secrets passed"
    - echo "✓ audit passed"
    - echo "✓ lint passed"
    - echo "✓ caddyfile passed"
    - echo "✓ image-scan passed"
    - echo "All CI checks green."
  needs:
    - secrets
    - audit
    - lint
    - caddyfile
    - image-scan
  rules:
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
