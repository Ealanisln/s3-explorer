title = "S3 Explorer — gitleaks config"

# Use the default rule pack.
[extend]
useDefault = true

# Global allowlist — what to IGNORE in findings.
#
# Reviewed 2026-10-28. The previous revision excluded `README.md`,
# `CHANGELOG.md`, `tests/` and `.env.example` wholesale. A probe run with those
# paths re-enabled found exactly one finding across the whole history
# (4 commits): a `generic-api-key` hit on the object-key literal below. The
# directory-wide exclusions were hiding nothing else, and leaving them in place
# meant any real key pasted into docs, changelog or a test fixture would go
# unreported. They are gone; only exclusions that cannot contain secrets (local
# files, vendored code, generated content) remain.
[allowlist]
description = "Ignored paths and known-safe matches"

paths = [
  '''\.env$''',                       # never committed (see .gitignore); local-only if it appears
  '''node_modules/''',                # vendored dependencies
  '''pnpm-lock\.yaml$''',             # integrity hashes trip the generic rules
  '''public/.*\.css$''',              # base64-embedded fonts
  '''dev-data/''',                    # local scratch data, gitignored
]

regexes = [
  '''sha256:[a-f0-9]{64}''',          # Docker image digests
  '''\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}''',  # bcrypt example hashes in docs
  '''CHANGE-ME''',                    # placeholder
  '''openssl rand''',                 # command example, not a secret
  '''<your-.*>''',                    # template angle-bracketed placeholders
  '''^parent/child/$''',              # object-key literal in tests/integration/api/objects.test.ts (generic-api-key false positive)
]

stopwords = [
  "example",
  "placeholder",
  "your-secret-here",
]
